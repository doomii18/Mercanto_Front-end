<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Comprador — Mercanto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./src/styles/registro_comprador.css">
</head>
<body>

    <!-- Header -->
    <header class="top-header">
        <div class="logo">
            <img src="./src/assets/logo.png" alt="Mercanto Icon" class="logo-icon">
        </div>
        <a href="index.html" class="home-icon">
            <i class="fa-solid fa-house"></i>
        </a>
    </header>

    <main class="wizard-container">
        <div class="wizard-header">
            <h1>Registro de Comprador</h1>
            <p>Completa la información requerida para crear una cuenta de comprador en la plataforma.</p>
        </div>

        <div class="wizard-card">
            <div class="wizard-step active-step">
                <h3 class="step-title">Información Personal</h3>
                
                <div class="form-grid">
                    <div class="form-group">
                        <label>1. Nombres <span class="required">*</span></label>
                        <input type="text" id="comp-nombres" placeholder="Héctor Raul">
                    </div>
                    
                    <div class="form-group">
                        <label>2. Apellidos <span class="required">*</span></label>
                        <input type="text" id="comp-apellidos" placeholder="Hernández López">
                    </div>

                    <div class="form-group">
                        <label>3. Cédula de identidad <span class="required">*</span></label>
                        <input type="text" id="comp-cedula" placeholder="401-241200-1006E">
                    </div>

                    <div class="form-group">
                        <label>4. Departamento <span class="required">*</span></label>
                        <div class="select-wrapper">
                            <select id="comp-departamento">
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="Granada">Granada</option>
                                <option value="Managua">Managua</option>
                                <option value="Masaya">Masaya</option>
                            </select>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>5. Municipio <span class="required">*</span></label>
                        <div class="select-wrapper">
                            <select id="comp-municipio">
                                <option value="" disabled selected>Seleccione...</option>
                                <option value="Diriomo">Diriomo</option>
                                <option value="Granada">Granada</option>
                                <option value="Nandaime">Nandaime</option>
                            </select>
                            <i class="fa-solid fa-chevron-down"></i>
                        </div>
                    </div>

                    <div class="form-group">
                        <label>6. Correo electrónico <span class="required">*</span></label>
                        <input type="email" id="comp-correo" placeholder="hectorhernan@gmail.com">
                    </div>

                    <div class="form-group">
                        <label>7. Teléfono <span class="required">*</span></label>
                        <input type="tel" id="comp-telefono" placeholder="8730 9208">
                    </div>

                    <div class="form-group">
                        <label>8. Foto de Perfil</label>
                        <div class="drag-drop-zone" id="drag-drop-foto">
                            <i class="fa-solid fa-cloud-arrow-up cloud-icon"></i>
                            <p>Arrastra una imagen aquí</p>
                            <span>o</span>
                            <button type="button" class="btn-outline" id="btn-browse-foto">Seleccionar archivo</button>
                            <input type="file" id="file-foto" accept="image/png, image/jpeg" style="display: none;">
                        </div>
                        <div id="foto-preview-container" style="display: none;" class="preview-container">
                            <img id="foto-preview" src="" alt="Foto de perfil">
                            <button type="button" class="btn-remove-foto" id="btn-remove-foto"><i class="fa-solid fa-xmark"></i></button>
                        </div>
                    </div>
                </div>

                <div class="step-actions right-align" style="justify-content: flex-end; gap: 1rem; margin-top: 3rem;">
                    <button type="button" class="btn-orange" id="btn-cancelar">Cancelar</button>
                    <button type="button" class="btn-teal" id="btn-submit">Continuar <i class="fa-solid fa-arrow-right"></i></button>
                </div>
            </div>
        </div>
    </main>

    <script src="./src/registro_comprador.js"></script>
</body>
</html>
