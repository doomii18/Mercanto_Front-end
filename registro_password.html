<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Contraseña — Mercanto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./src/styles/registro_proveedor.css">
    <link rel="stylesheet" href="./src/styles/registro_password.css">
</head>
<body>

    <header class="top-header">
        <div class="logo">
            <img src="./src/assets/logo.png" alt="Mercanto Icon" class="logo-icon">
        </div>
        <a href="index.html" class="home-icon">
            <i class="fa-solid fa-house"></i>
        </a>
    </header>

    <main class="password-container">
        <div class="password-card">
            <div class="success-icon">
                <i class="fa-solid fa-check"></i>
            </div>
            <h2>¡Registro guardado!</h2>
            <p>Para completar tu registro, crea una contraseña para tu cuenta.</p>

            <form id="password-form">
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-regular fa-envelope left-icon"></i>
                        <input type="email" value="echamorro@gmail.com" disabled>
                    </div>
                </div>

                <div class="form-group">
                    <label>Contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock left-icon"></i>
                        <input type="password" id="pass" placeholder="Ingresa tu contraseña">
                        <i class="fa-regular fa-eye right-icon" onclick="togglePass('pass', this)"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label>Confirmar contraseña</label>
                    <div class="input-icon-wrapper">
                        <i class="fa-solid fa-lock left-icon"></i>
                        <input type="password" id="pass-confirm" placeholder="Confirma tu contraseña">
                        <i class="fa-regular fa-eye right-icon" onclick="togglePass('pass-confirm', this)"></i>
                    </div>
                </div>

                <div class="card-actions">
                    <button type="button" class="btn-cancel" onclick="window.location.href='index.html'">Cancelar</button>
                    <button type="submit" class="btn-save">Guardar y continuar</button>
                </div>
            </form>
        </div>
    </main>

    <script src="./src/registro_password.js"></script>
</body>
</html>
