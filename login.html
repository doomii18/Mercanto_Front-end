<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión — Mercanto</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="./src/styles/login.css">
</head>
<body>

<div class="login-container">

    <!-- Panel izquierdo -->
    <div class="login-left">
        <div class="login-brand">
            <img src="./src/assets/1.1 Imagotipo variacion.png" alt="Mercanto" style="height: 100px;">
        </div>
        
        <h2 class="login-left-title">
            Encuentra a los mejores proveedores<br>para <span>TÚ</span> negocio
        </h2>

        <div class="login-hero-image">
            <img src="./src/assets/login_hero1.png" alt="Persona usando tablet ">
        </div>

        <div class="login-features-list">
            <div class="login-feature-item">
                <i class="fa-solid fa-certificate"></i>
                <span>Proveedores verificados</span>
            </div>
            <div class="login-feature-item">
                <i class="fa-solid fa-box"></i>
                <span>Compras al por mayor</span>
            </div>
        </div>

        <img src="./src/assets/city_outline.png" alt="City Outline" class="city-outline" style="mix-blend-mode: screen;">
    </div>

    <!-- Panel derecho -->
    <div class="login-right" style="position: relative;">
        <div class="login-card">
            <div class="card-header">
                <div class="store-icon">
                    <i class="fa-solid fa-store"></i>
                </div>
                <h3>¡Bienvenido de nuevo!</h3>
                <p>Inicia sesión en tu cuenta</p>
            </div>

            <form action="#">
                <div class="form-group">
                    <label for="email">Correo electrónico:</label>
                    <div class="input-wrapper">
                        <i class="fa-regular fa-envelope input-icon"></i>
                        <input type="email" id="email" placeholder="example@gmail.com" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Contraseña:</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock input-icon"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                        <button type="button" class="toggle-password" id="toggle-password-btn" aria-label="Mostrar contraseña">
                            <i class="fa-solid fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-options">
                    <label class="checkbox-label">
                        <input type="checkbox" name="remember">
                        Recordarme
                    </label>
                    <a href="#" class="forgot-password">¿Olvidaste tu contraseña?</a>
                </div>

                <button type="submit" class="btn-submit">
                    Iniciar sesión <i class="fa-solid fa-arrow-right"></i>
                </button>

                <div class="divider-container">
                    <div class="divider-line"></div>
                    <div class="divider-dot"></div>
                    <div class="divider-line"></div>
                </div>

                <div class="register-link-container">
                    ¿No tienes cuenta?
                    <a href="registro.html">Registrate</a>
                </div>
            </form>
        </div>
        
        <!-- Envíos a todo el país (fuera de la tarjeta en el mockup) -->
        <div class="shipping-info">
            <i class="fa-solid fa-truck-fast"></i>
            Envíos a todo el país
        </div>
    </div>

</div>

<script type="module" src="./src/loginAuth.js"></script>
</body>
</html>
